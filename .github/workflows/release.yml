name: Release UniFlashTool

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC dev cmd
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install curlpp curl libarchive openssl
          echo "LibArchive_ROOT=$(brew --prefix libarchive)" >> $GITHUB_ENV
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl)" >> $GITHUB_ENV

      - name: Install Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-dev libcurl4-openssl-dev libssl-dev uuid-dev zlib1g-dev

      - name: Setup vcpkg (Windows)
        if: runner.os == 'Windows'
        run: |
          vcpkg install libarchive:x64-windows curl:x64-windows curlpp:x64-windows openssl:x64-windows

      - name: Configure & Build
        shell: bash
        run: |
          CMAKE_FLAGS=""
          if [ "${{ runner.os }}" == "Windows" ]; then
            CMAKE_FLAGS="-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake"
          elif [ "${{ runner.os }}" == "macOS" ]; then
            CMAKE_FLAGS="-DLibArchive_ROOT=$(brew --prefix libarchive)"
          fi

          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release $CMAKE_FLAGS
          cmake --build build --config Release --parallel

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/uniflashtool
          cp build/uniflashtool dist/uniflashtool/ 2>/dev/null || cp build/Release/uniflashtool dist/uniflashtool/
          cp -r web dist/uniflashtool/web
          cd dist
          if [ "${{ runner.os }}" == "macOS" ]; then
            zip -r ../UniFlashTool-MacOS.zip uniflashtool
          else
            tar -czf ../UniFlashTool-Linux.tar.gz uniflashtool
          fi

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/uniflashtool"
          Copy-Item "build/Release/uniflashtool.exe" "dist/uniflashtool/"
          Copy-Item -Recurse "web" "dist/uniflashtool/web"

          # Plus besoin de windeployqt, juste les DLL vcpkg si tu n'as pas tout linké statique
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          Get-ChildItem -Path "$vcpkgRoot/installed/x64-windows/bin/*.dll" -ErrorAction SilentlyContinue |
            Copy-Item -Destination "dist/uniflashtool/"

          Compress-Archive -Path dist/uniflashtool/* -DestinationPath UniFlashTool-Windows.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: ignore
          name: binary-${{ matrix.os }}
          path: |
            UniFlashTool-Windows.zip
            UniFlashTool-Linux.tar.gz
            UniFlashTool-MacOS.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/UniFlashTool-Windows.zip
            ./artifacts/UniFlashTool-Linux.tar.gz
            ./artifacts/UniFlashTool-MacOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}