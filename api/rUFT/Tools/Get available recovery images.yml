info:
  name: Get available recovery images
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/available/recovery"
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:6767

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
