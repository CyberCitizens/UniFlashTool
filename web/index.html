<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="style.css">
	<title>Renewed Universal Flashing Tool</title>
</head>
<body>
	<dialog id="dlDialog" style="
		display: none;
		position: sticky;
		top: 20%;
		bottom: 20%;
		left: 10%;
		right: 10%;
		background-color: var(--light-transparent);
		border-radius: var(--safezone);
		border: solid white 1px;
	">
		<h2>Téléchargements</h2>
		<table id="dlTable">
			<thead>
				<td>Nom</td>
				<td>Statut</td>
				<td>Téléchargés</td>
				<td>Total attendu</td>
			</thead>
		</table>
	</dialog>
	<main style="
		display: grid;
		grid-template-columns: 1fr 1fr 1fr;
		grid-template-rows: 1fr 14fr 1fr;
		width: 80%;
		text-align: left;
		position: absolute;
		left: 10%;
		right: 10%;
		top: 10%;
		bottom: 20%;
		padding: 3rem;
		column-gap: 1rem;
		"
		class="box">
		<h1 style="grid-area: 1/2/1/3; text-align: center;">Alors, on flashe <span id="codenameText" style="font-weight: bolder;"></span>?</h1>
		<section class="box" style="
			grid-area: 2/1/3/2;
		">
			<h2 class="whole-line">Recovery Image<button id="btnAddRecovery"><img src="/assets/icons/plus.svg" alt="" width="32" height="32"></button></h2>
			<div id="recoveryHolder" class="list">
			</div>
		</section>
		<section class="box" style="
			grid-area: 2/2/3/3;
		">
			<h2 class="whole-line">ROM<button id="btnAddROM"><img src="/assets/icons/plus.svg" alt="" width="32" height="32"></button></h2>
			<div id="romHolder" class="list">
			</div>
		</section>
		<section class="box" style="
			grid-area: 2/3/3/4;
		">
			<h2 class="whole-line">Additional tools<button id="btnAddTool"><img src="/assets/icons/plus.svg" alt="" width="32" height="32"></button></h2>
			<div id="otherHolder" class="list">
			</div>
		</section>
		<section style="
			grid-area: 3/2/4/3;
			text-align: center;
		">
			<button style="margin: 1rem; width: 3rem; height: 3rem;" id="downloadButton">
				<img src="/assets/icons/download.svg" alt="Lancer les téléchargements" title="Lancer les téléchargements">
			</button>
		</section>
	</main>
	<script type="module">
		import { Handy, Query } from './api.js';
		import { DownloadEverything, GetAllSelectedTools, GenerateToolLists } from './interactive.js';

		window.is_flashing = false;

		setInterval(async () => {
			if(!window.is_flashing)
				document.getElementById("codenameText").textContent = (await Handy.getCodename())["codename"];
		}, 1000);
		// retrieves all tools at once (saves some cycles and unecessary local network traffic at the
		// IMMENSE cost of permament 2kb or sum like that idk)
		

		
		const downloadButton = document.getElementById('downloadButton');
		downloadButton.addEventListener("click", async e => {
			const tools = await GetAllSelectedTools();
			await Handy.addTools(tools);
			DownloadEverything();
		})
		
		GenerateToolLists();
	</script>
	<script type="module">
		import { Handy, Query } from './api.js';
		import * as interactive from './interactive.js';

		const bindEmAll =
		{
			"btnAddTool"		:	interactive.ShowAddTool,
			"btnAddROM"			:	interactive.ShowAddROM,
			"btnAddRecovery"	:	interactive.ShowAddRecovery,
		};

		for(const id in bindEmAll)
		{
			const element = document.getElementById(id);
			if(element == undefined)
				console.log(`Existential crisis for ${id}`);
			else
				element.addEventListener("click", e => bindEmAll[id]());
		}
	</script>
</body>
</html>
